# Companies to scan for open positions.
# Copy to config/portals.yml and customise.
#
# Group A (auto-detected ATS APIs): Lever, Greenhouse, Ashby URLs are scraped
# directly by `node src/scan/index.mjs` — zero LLM cost.
#
# Group B (custom career pages): handled via an agentic scanner (not in v0.1).
#
# NOTE (2026-09-03): Google, Amazon, Apple, Meta, Netflix, NVIDIA, and most
# large banks run their OWN custom career sites — not Lever/Greenhouse/Ashby/
# Workday. Group B (the only thing that could reach them) isn't built yet, so
# they cannot be added here in a way that would actually work. This file can
# only cover companies genuinely hosted on one of the 4 supported platforms.

tracked_companies:
  - name: Mistral AI
    careers_url: https://jobs.lever.co/mistral
    enabled: true
    # Domain is implicit in company name — skip required_any filter
    skip_required_any: true
  - name: PointClickCare
    careers_url: https://jobs.lever.co/pointclickcare
    enabled: true
  - name: Analytic Partners
    careers_url: https://jobs.lever.co/analyticpartners
    enabled: true
  # Added 2026-09-03 — all three confirmed live via real capply test runs
  # against the real (non-mock) candidate profile.
  - name: Fliff
    careers_url: https://jobs.lever.co/Fliff
    enabled: true
  - name: PadSplit
    careers_url: https://jobs.lever.co/padsplit
    enabled: true
  - name: Aircall
    careers_url: https://jobs.lever.co/aircall
    enabled: true

title_filter:
  # positive and negative terms match WHOLE WORDS, case-insensitive.
  # Examples:
  #   - "stage"    matches "Stage Data", does NOT match "Backstage"
  #   - "intern"   matches "Intern", does NOT match "International"
  #     (add "interns", "internship" explicitly if you want those)
  #
  # Escape hatch — wrap a real regex in slashes for power cases:
  #   - "/^stage\\b/i"        anchor to start of title
  #   - "/ml\\s*engineer/i"   allow optional whitespace
  #
  # Titles must contain at least one of these.
  positive:
    - Data
    - Analyst
    - Scientist
    - Engineer

  # Optional exclusion keywords — offers matching any of these are dropped.
  negative: []

  # Optional domain filter applied *on top of* positive/negative:
  # if set, the job title must contain at least one of these keywords
  # (same whole-word semantics and regex escape hatch as above).
  # Leave empty or omit to skip. Use `skip_required_any: true` per company
  # to bypass for portals whose titles do not include the domain keyword.
  required_any: []

  # When `required_any` is set, also match against the offer description
  # if the title alone doesn't contain one of the keywords. Default: [title].
  required_any_in: [title]

# Aggregator-based discovery (company-agnostic).
#
# Aggregators query a curated set of public ATS boards in a single shot, so
# you don't have to add each company to `tracked_companies` above. Run:
#   /scan --source aggregator     # only aggregators
#   /scan --source all            # tracked_companies + aggregators
#   /scan                         # default — only tracked_companies
#
# IMPORTANT: `capply`/scan need --source all (or a separate --source
# aggregator run) to actually pick these up — the plain default `/scan` only
# hits tracked_companies above. Update the Routine's run command accordingly.
aggregators:
  # Greenhouse public aggregator — RESTORED 2026-09-03 (was accidentally
  # dropped in the previous edit). Hits boards-api.greenhouse.io for ~20
  # well-known, pre-verified public boards shipped with the repo
  # (src/scan/aggregators/known-greenhouse-boards.json): Anthropic, OpenAI,
  # Stripe, Airbnb, DoorDash, Instacart, Shopify, GitLab, Datadog, Cloudflare,
  # Discord, Figma, Notion, Vercel, Scale AI, Asana, DeepMind, Robinhood,
  # Twitch, Reddit.
  greenhouse:
    enabled: true
    keywords: []
    locations: []
    # boards: — left as default for broadest coverage
