# Companies to scan for open positions.
# Copy to config/portals.yml and customise.
#
# Group A (auto-detected ATS APIs): Lever, Greenhouse, Ashby URLs are scraped
# directly by `node src/scan/index.mjs` — zero LLM cost.
#
# Group B (custom career pages): handled via an agentic scanner (not in v0.1).
#
# NOTE (2026-09-03): Google, Amazon, Apple, Meta, Netflix, NVIDIA, and most
# large banks run their OWN custom career sites — not Lever/Greenhouse/Ashby/
# Workday. Group B (the only thing that could reach them) isn't built yet, so
# they cannot be added here in a way that would actually work. This file can
# only cover companies genuinely hosted on one of the 4 supported platforms.
#
# NOTE (2026-09-05): tracked_companies below are mock/test entries and are
# NOT scanned by the daily run — the daily run uses `--source aggregator`,
# which skips tracked_companies entirely and only queries the aggregators
# block. Left in place for manual `--source ats` / `--only <slug>` testing.

tracked_companies:
  - name: Mistral AI
    careers_url: https://jobs.lever.co/mistral
    enabled: true
    skip_required_any: true
  - name: PointClickCare
    careers_url: https://jobs.lever.co/pointclickcare
    enabled: true
  - name: Analytic Partners
    careers_url: https://jobs.lever.co/analyticpartners
    enabled: true
  - name: Fliff
    careers_url: https://jobs.lever.co/Fliff
    enabled: true
  - name: PadSplit
    careers_url: https://jobs.lever.co/padsplit
    enabled: true
  - name: Aircall
    careers_url: https://jobs.lever.co/aircall
    enabled: true

title_filter:
  # Titles must contain at least one positive keyword (whole-word match).
  positive:
    - Data
    - Analyst
    - Scientist
    - Engineer

  # Layer 1 seniority filter: titles matching ANY of these are dropped
  # immediately — zero AI cost. These roles consistently score 1-3 in
  # Phase 2 against Rohan's profile (M.S. 2026 grad, internship-level
  # experience), so scoring them wastes Claude tokens.
  negative:
    - Senior
    - Sr
    - Staff
    - Principal
    - Director
    - VP
    - Head
    - Chief
    - Manager
    - Lead
    - Architect
    - Intern
    - Internship

  required_any: []
  required_any_in: [title]

aggregators:
  greenhouse:
    enabled: true
    keywords: []
    locations: []

  # Lever aggregator: scans ALL 4,368 boards every run (no maxBoardsPerRun
  # cap). Phase 1 is $0 AI cost, so there's no reason to skip boards.
  # The cascade filter (Layer 1 regex + Layer 2 embedding similarity)
  # narrows the results down to the top 10 before any Claude tokens are
  # spent in Phase 2.
  lever:
    enabled: true
    keywords: []
    locations: []
