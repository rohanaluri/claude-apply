# Companies to scan for open positions.
# Copy to config/portals.yml and customise.
#
# Group A (auto-detected ATS APIs): Lever, Greenhouse, Ashby URLs are scraped
# directly by `node src/scan/index.mjs` — zero LLM cost.
#
# Group B (custom career pages): handled via an agentic scanner (not in v0.1).
#
# NOTE (2026-09-03): Google, Amazon, Apple, Meta, Netflix, NVIDIA, and most
# large banks run their OWN custom career sites — not Lever/Greenhouse/Ashby/
# Workday. Group B (the only thing that could reach them) isn't built yet, so
# they cannot be added here in a way that would actually work. This file can
# only cover companies genuinely hosted on one of the 4 supported platforms.
#
# NOTE (2026-09-19): tracked_companies removed (was mock/test entries only).
# The daily run uses `--source aggregator`, which never reads this list —
# see the aggregators block below for the actual company universe. To
# manually test one company by ATS (`--source ats --only <slug>`, or to use
# a per-company `skip_required_any`/`target_locations` override), add an
# entry back here, e.g.:
#   - name: Mistral AI
#     careers_url: https://jobs.lever.co/mistral
#     enabled: true
#     skip_required_any: true   # domain is implicit in the company name

tracked_companies: []

title_filter:
  # Titles must contain at least one positive keyword (whole-word match).
  positive:
    - Data
    - Analyst
    - Scientist
    - Engineer
    - Analytics

  # Layer 1 seniority + relevance filter: titles matching ANY of these are
  # dropped immediately — zero AI cost. Seniority terms consistently score
  # 1-3 in Phase 2 against Rohan's profile (M.S. 2026 grad, internship-level
  # experience). The rest (2026-09-19) were added after a 2,243-title dry
  # run of the aggregator source showed the bare positive list letting
  # through non-data/software "Engineer"/"Analyst"/"Scientist" roles —
  # Electrical/Mechanical/Civil/Structural/Manufacturing engineers, "Data
  # collector / Driver" (a driving job), Data Entry clerks, cleared/
  # polygraph government roles, etc. See docs/project-notes for the full
  # before/after counts (2,243 -> 497 candidates on that test set).
  negative:
    - Senior
    - Sr
    - Staff
    - Principal
    - Director
    - VP
    - Head
    - Chief
    - Manager
    - Lead
    - Architect
    - Intern
    - Internship
    - Electrical
    - Mechanical
    - Civil
    - Structural
    - Manufacturing
    - Robotics
    - Hardware
    - Field
    - Controls
    - Automation
    - Network
    - Sales
    - Driver
    - Collector
    - Cyber
    - AV
    - Security
    - Test
    - Quality
    - Recruiter
    - Recruiting
    - Legal
    - Attorney
    - Nurse
    - Clinical
    - Physician
    - Warehouse
    - Retail
    - Store
    - Entry
    - Clerk
    - Technician
    - Agent
    - Polygraph
    - SCI

  # Domain filter layered on top of positive/negative (2026-09-19): the
  # title must also contain one of these, so a title that only matches
  # "Analyst"/"Engineer"/"Scientist" via the positive list but has no
  # data/software/AI signal (e.g. "Business Systems Analyst") is dropped.
  required_any:
    - Data
    - Software
    - Analytics
    - Machine Learning
    - AI
    - ML

  required_any_in: [title]

aggregators:
  greenhouse:
    enabled: true
    keywords: []
    locations: []

  # Lever aggregator: scans ALL 4,368 boards every run (no maxBoardsPerRun
  # cap). Phase 1 is $0 AI cost, so there's no reason to skip boards.
  # The cascade filter (Layer 1 regex + Layer 2 embedding similarity)
  # narrows the results down to the top 10 before any Claude tokens are
  # spent in Phase 2.
  lever:
    enabled: true
    keywords: []
    locations: []
